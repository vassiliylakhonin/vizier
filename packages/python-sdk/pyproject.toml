[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vizier-guard"
version = "0.3.2"
description = "Deterministic authorization and audit guard for AI agent actions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Vassiliy Lakhonin", email = "vassiliy.lakhonin@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ai", "agents", "security", "authorization", "guardrails", "langchain", "mcp"]
dependencies = []

[project.optional-dependencies]
pydantic = ["pydantic>=2.0"]
httpx = ["httpx>=0.24.0"]
langchain = ["langchain-core>=0.1.0"]
test = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/vassiliylakhonin/vizier"
Documentation = "https://vizier.vassiliy-lakhonin.workers.dev/docs"
Repository = "https://github.com/vassiliylakhonin/vizier"

[project.scripts]
vizier-guard = "vizier.mcp:main"
vizier-mcp = "vizier.mcp:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
