name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to publish (vizier-guard or vizier)'
        required: true
        default: 'vizier-guard'
        type: choice
        options:
          - vizier-guard
          - vizier
      version:
        description: 'Version to publish (e.g. 0.3.2)'
        required: true
        default: '0.3.2'
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Prepare manifest
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$TARGET" = 'vizier' || "$TARGET" = 'vizier-guard' ]] || exit 1
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-registry\.[1-9][0-9]*)?$ ]] || exit 1
          echo "Publishing MCP registry entry for $TARGET version $VERSION"
          if [ "$TARGET" = "vizier-guard" ]; then
            cp packages/python-sdk/server.json server.json
            jq --arg v "$VERSION" '.version = $v | (.packages[].version) = $v' server.json > server.tmp
            mv server.tmp server.json
          else
            jq --arg v "$VERSION" '.version = $v' server.json > server.tmp
            mv server.tmp server.json
          fi
          echo "--- server.json to be published ---"
          cat server.json

      - name: Install mcp-publisher
        env:
          PUBLISHER_VERSION: v1.8.1
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          url="https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl -sSLf "$url" -o "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "${PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP/bin" mcp-publisher
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/mcp-publisher" --version

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Wait for package version on PyPI (if vizier-guard)
        if: ${{ inputs.target == 'vizier-guard' }}
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          package_url="https://pypi.org/pypi/vizier-guard/${VERSION}/json"
          for attempt in {1..10}; do
            if curl --fail --silent --show-error "$package_url" >/dev/null; then
              echo "vizier-guard ${VERSION} is visible on PyPI"
              exit 0
            fi
            if [ "$attempt" -lt 10 ]; then
              echo "PyPI version not visible yet (attempt ${attempt}/10); retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "::error::vizier-guard ${VERSION} was not visible on PyPI after 10 attempts"
          exit 1

      - name: Publish server to MCP Registry
        run: mcp-publisher publish

      - name: Verify exact latest Registry metadata
        run: |
          python - <<'PYTHON'
          import json, time, urllib.request
          from pathlib import Path
          from urllib.parse import quote
          manifest = json.loads(Path('server.json').read_text())
          url = 'https://registry.modelcontextprotocol.io/v0.1/servers/' + quote(manifest['name'], safe='') + '/versions/latest'
          def normalized(remotes):
              remotes = json.loads(json.dumps(remotes))
              for remote in remotes:
                  for header in remote.get('headers', []):
                      header.setdefault('isRequired', False)
              return remotes
          for attempt in range(12):
              with urllib.request.urlopen(url, timeout=30) as response:
                  entry = json.load(response)
              latest = entry.get('server', {})
              official = entry.get('_meta', {}).get('io.modelcontextprotocol.registry/official', {})
              if latest.get('version') == manifest['version'] and official.get('isLatest') is True:
                  for field in ('name', 'websiteUrl', 'packages'):
                      assert latest.get(field) == manifest.get(field), field + ' drift'
                  assert normalized(latest.get('remotes', [])) == normalized(manifest.get('remotes', [])), 'remotes drift'
                  print('Verified exact latest Registry metadata')
                  break
              if attempt == 11:
                  raise SystemExit('Registry latest version did not converge')
              time.sleep(5)
          PYTHON
