name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to publish (vizier-guard or vizier)'
        required: true
        default: 'vizier-guard'
        type: choice
        options:
          - vizier-guard
          - vizier
      version:
        description: 'Version to publish (e.g. 0.3.2)'
        required: true
        default: '0.3.2'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare manifest
        run: |
          TARGET="${{ inputs.target }}"
          VERSION="${{ inputs.version }}"
          echo "Publishing MCP registry entry for $TARGET version $VERSION"
          if [ "$TARGET" = "vizier-guard" ]; then
            cp packages/python-sdk/server.json server.json
            jq --arg v "$VERSION" '.version = $v | (.packages[].version) = $v' server.json > server.tmp
            mv server.tmp server.json
          else
            jq --arg v "$VERSION" '.version = $v' server.json > server.tmp
            mv server.tmp server.json
          fi
          echo "--- server.json to be published ---"
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version || true

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Wait for package version on PyPI (if vizier-guard)
        if: inputs.target == 'vizier-guard'
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          package_url="https://pypi.org/pypi/vizier-guard/${VERSION}/json"
          for attempt in {1..10}; do
            if curl --fail --silent --show-error "$package_url" >/dev/null; then
              echo "vizier-guard ${VERSION} is visible on PyPI"
              exit 0
            fi
            if [ "$attempt" -lt 10 ]; then
              echo "PyPI version not visible yet (attempt ${attempt}/10); retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "::error::vizier-guard ${VERSION} was not visible on PyPI after 10 attempts"
          exit 1

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
