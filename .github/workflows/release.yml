name: Release Packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not publish to registries)"
        required: true
        type: boolean
        default: true

      publish_npm:
        description: "Explicitly publish npm packages (requires NPM_TOKEN)"
        required: true
        type: boolean
        default: false
      publish_pypi:
        description: "Explicitly publish Python SDK (requires a valid PyPI token)"
        required: true
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: Build Node archives (optional npm publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - name: Verify release tag matches package version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) throw new Error("Release tag/package version mismatch");'
      - run: npm ci
      - run: npm run check

      - name: Verify npm package tarballs
        run: |
          npm pack --dry-run --workspace @agenda-intelligence/vizier-sdk
          npm pack --dry-run --workspace @agenda-intelligence/vizier-mcp-proxy
          npm pack --dry-run --workspace @agenda-intelligence/vizier-gated-deploy

      - name: Build installable release archives
        run: |
          mkdir -p release-archives
          npm pack --workspace @agenda-intelligence/vizier-sdk --pack-destination release-archives
          npm pack --workspace @agenda-intelligence/vizier-mcp-proxy --pack-destination release-archives
          npm pack --workspace @agenda-intelligence/vizier-gated-deploy --pack-destination release-archives
          cd release-archives
          sha256sum *.tgz > SHA256SUMS

      - name: Verify archives install without a published Vizier scope
        run: node scripts/check-release-archives.mjs release-archives

      - name: Publish archives to GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes "Installable SDK, MCP proxy and Worker deployment adapter/CLI archives; see SHA256SUMS. Not published to npm or PyPI. Session guard is an operator-owned, memory-only proxy session over labelled tools, not an OS sandbox or complete prompt-injection protection. See CHANGELOG.md and docs/SESSION_GUARD.md for scope and limits."
          gh release upload "$RELEASE_TAG" release-archives/* --clobber

      - name: Report archive-only distribution
        if: github.event_name == 'push' || !inputs.publish_npm || env.HAS_NPM_TOKEN != 'true'
        run: |
          echo "::warning::Archive-only distribution: no npm registry publication occurred (not requested or NPM_TOKEN unavailable)."
          echo "npm registry: NOT PUBLISHED. Use GitHub Release archives." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to npm
        if: ${{ env.HAS_NPM_TOKEN == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish_npm && !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not configured; refusing silent publish skip."
            exit 1
          else
            npm publish --workspace @agenda-intelligence/vizier-sdk --access public
            npm publish --workspace @agenda-intelligence/vizier-mcp-proxy --access public
            npm publish --workspace @agenda-intelligence/vizier-gated-deploy --access public
          fi

      - name: Verify published npm packages install cleanly
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm && !inputs.dry_run && env.HAS_NPM_TOKEN == 'true' }}
        run: |
          TARGET_VERSION=$(node -p "require('./package.json').version")
          echo "Verifying npm packages can be installed from npmjs.org at exact version ${TARGET_VERSION}..."
          mkdir -p "$RUNNER_TEMP/npm-install-test"
          cd "$RUNNER_TEMP/npm-install-test"
          for attempt in {1..8}; do
            if npm install --no-save --registry https://registry.npmjs.org "@agenda-intelligence/vizier-sdk@${TARGET_VERSION}" "@agenda-intelligence/vizier-mcp-proxy@${TARGET_VERSION}" "@agenda-intelligence/vizier-gated-deploy@${TARGET_VERSION}"; then
              echo "npm packages installed successfully at version ${TARGET_VERSION}."
              exit 0
            fi
            echo "Waiting for npm registry to index version ${TARGET_VERSION} (attempt $attempt/8)..."
            sleep 15
          done
          echo "::error::Package installation check timed out waiting for npm registry indexing of version ${TARGET_VERSION}."
          exit 1

  pypi:
    # Tags release Node archives only. Python publication requires explicit opt-in.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi
    name: Build & Publish Python SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build and test tools
        run: pip install build twine pytest cryptography

      - name: Run Python test suite
        run: python -m pytest packages/python-sdk -v

      - name: Build wheel and sdist
        run: python -m build packages/python-sdk

      - name: Verify package integrity
        run: twine check packages/python-sdk/dist/*

      - name: Publish to PyPI
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && env.HAS_PYPI_TOKEN == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python-sdk/dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Verify published PyPI package installs cleanly
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && env.HAS_PYPI_TOKEN == 'true' }}
        run: |
          PYPI_VERSION=$(python -c "import tomllib; print(tomllib.load(open('packages/python-sdk/pyproject.toml', 'rb'))['project']['version'])")
          echo "Verifying vizier-guard installs from PyPI at exact version ${PYPI_VERSION}..."
          for attempt in {1..8}; do
            if pip install --no-cache-dir "vizier-guard==${PYPI_VERSION}"; then
              echo "vizier-guard==${PYPI_VERSION} installed successfully from PyPI."
              exit 0
            fi
            echo "Waiting for PyPI index to make version ${PYPI_VERSION} available (attempt $attempt/8)..."
            sleep 15
          done
          echo "::error::PyPI package installation check timed out for version ${PYPI_VERSION}."
          exit 1

      - name: Report unchanged Python SDK publication status
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && env.HAS_PYPI_TOKEN != 'true' }}
        run: |
          echo "::warning::PYPI_API_TOKEN is not configured; Python SDK was built and tested but not published."
          echo "Vizier Python registry: NOT PUBLISHED (missing PYPI_API_TOKEN)." >> "$GITHUB_STEP_SUMMARY"
