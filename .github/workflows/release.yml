name: Release Packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not publish to registries)"
        required: true
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: Build & Publish npm Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Verify npm package tarballs
        run: |
          npm pack --dry-run --workspace @vizier/sdk
          npm pack --dry-run --workspace @vizier/mcp-proxy

      - name: Publish to npm
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not configured; refusing silent publish skip."
            exit 1
          else
            npm publish --workspace @vizier/sdk --access public
            npm publish --workspace @vizier/mcp-proxy --access public
          fi

      - name: Verify published npm packages install cleanly
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && secrets.NPM_TOKEN != '' }}
        run: |
          echo "Verifying npm packages can be installed from npmjs.org..."
          mkdir -p "$RUNNER_TEMP/npm-install-test"
          cd "$RUNNER_TEMP/npm-install-test"
          for attempt in {1..8}; do
            if npm install --no-save --registry https://registry.npmjs.org @vizier/sdk @vizier/mcp-proxy; then
              echo "npm packages installed successfully."
              exit 0
            fi
            echo "Waiting for npm registry to index newly published version (attempt $attempt/8)..."
            sleep 15
          done
          echo "::warning::Package installation check timed out waiting for npm registry indexing."

  pypi:
    name: Build & Publish Python SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and test tools
        run: pip install build twine pytest

      - name: Run Python test suite
        run: python -m pytest packages/python-sdk -v

      - name: Build wheel and sdist
        run: python -m build packages/python-sdk

      - name: Verify package integrity
        run: twine check packages/python-sdk/dist/*

      - name: Publish to PyPI
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && env.HAS_PYPI_TOKEN == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python-sdk/dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Verify published PyPI package installs cleanly
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && env.HAS_PYPI_TOKEN == 'true' }}
        run: |
          echo "Verifying vizier-guard installs from PyPI..."
          for attempt in {1..8}; do
            if pip install --no-cache-dir vizier-guard; then
              echo "vizier-guard installed successfully from PyPI."
              exit 0
            fi
            echo "Waiting for PyPI index to make version available (attempt $attempt/8)..."
            sleep 15
          done
          echo "::warning::PyPI package installation check timed out."

      - name: Fail if PyPI token missing on release
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && env.HAS_PYPI_TOKEN != 'true' }}
        run: |
          echo "::error::PYPI_API_TOKEN secret is not configured in this repo; refusing silent PyPI publish skip."
          exit 1
