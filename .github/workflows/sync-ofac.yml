name: Sync OFAC address snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * *"

permissions:
  contents: read

concurrency:
  group: sync-ofac-snapshot
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch and validate official SDN XML
        run: python3 scripts/sync-ofac-snapshot.py "$RUNNER_TEMP/ofac-snapshot.json" "$RUNNER_TEMP/ofac-snapshot.sql"
      - name: Replace the single D1 snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute vizier-audit --remote --file "$RUNNER_TEMP/ofac-snapshot.sql"
