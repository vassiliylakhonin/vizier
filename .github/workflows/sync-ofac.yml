name: Sync OFAC address snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * *"

permissions:
  contents: read

concurrency:
  group: sync-ofac-snapshot
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch and validate official SDN XML
        run: python3 scripts/sync-ofac-snapshot.py "$RUNNER_TEMP/ofac-snapshot.json"
      - name: Replace the single KV snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --request PUT \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/ofac-snapshot.json" \
            "https://api.cloudflare.com/client/v4/accounts/c77c0bb599b8e90c7faadf4306141680/storage/kv/namespaces/16d2952b18ea415b9cc5c4033c716fb5/values/ofac-evm-addresses-v1" \
            | python3 -c 'import json,sys; p=json.load(sys.stdin); print("KV snapshot updated" if p.get("success") is True else "KV snapshot update failed"); sys.exit(0 if p.get("success") is True else 1)'
