name: Deploy

# Every deploy this repository has ever run was triggered by a direct push to
# main. On 2026-09-07 the first pull request merged since this workflow existed
# (#12) produced no run at all: main moved to v0.3.0 and production kept serving
# v0.2.2, with nothing to say so. The trigger was written for the way the
# repository worked at the time, and did not follow it to pull requests.
#
# `workflow_dispatch` is the hand crank — until now there was no way to deploy
# without pushing a commit. `drift` is the alarm: it runs the check that would
# have caught this on the day it happened, rather than the next time someone
# thought to look.

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 04:17 UTC daily, offset from the audit prune cron at 03:17.
    - cron: "17 4 * * *"

permissions:
  contents: read
  # Required by `mcp-publisher login github-oidc`, which exchanges the run's
  # OIDC token for a registry credential so no long-lived token is stored.
  id-token: write

concurrency:
  # Deliberately not keyed on github.ref: a merge can raise both a push and a
  # pull_request event, and those carry different refs for the same deploy.
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    # A closed pull request that was not merged must not deploy anything. The
    # scheduled run is for drift detection only.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull_request event would otherwise check out the PR's merge ref.
          # Production follows main, not a ref that stops existing.
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      
      - name: Apply D1 Migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply vizier-audit --remote
          
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      # Ordered before the registry step on purpose: an endpoint that does not
      # answer must not be advertised as a new version in a public registry.
      - name: Check the deployed Worker answers
        run: npm run check:live

      # The registry entry is the one copy of the service version no test can
      # reach. Pinned to a tag and a digest, because this binary runs with a
      # credential that can change the project's public listing.
      - name: Install mcp-publisher
        env:
          PUBLISHER_VERSION: v1.8.1
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          url="https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl -sSLf "$url" -o "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "${PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP/bin" mcp-publisher
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # A no-op unless server.json carries a version the registry lacks. This
      # step runs after the deploy, so a failure here marks the run red without
      # meaning the deploy failed; read which step carries the X.
      - name: Publish the MCP Registry entry
        run: node scripts/publish-registry.mjs

  # Answers one question daily: is production running what main says it is?
  # The check needs Cloudflare credentials, which is why it cannot live in CI.
  drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compare main against the deployed Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run check:deployed
