# Runs the same command a person runs before pushing: typecheck, lint, tests,
# and a dry-run build of the Worker.
#
# The repository had no CI at all until 2026-08-27. Nothing enforced that main
# built, and nothing compared main against production — which is how main came
# to sit a full day ahead of the deployed Worker without anyone noticing.
# `npm run check:deployed` answers the second question and is deliberately not
# run here: it needs Cloudflare credentials and describes the state of
# production, not the state of a commit.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Keep this before check/build: exercise the documented source-checkout
      # command without relying on an SDK dist left by another CI step.
      - name: Synthetic mass-ban guard regression (clean checkout)
        run: npm run demo:mass-ban
      - run: npm run check
      - name: Verify installable release archives
        run: |
          mkdir -p release-archives
          npm pack --workspace @agenda-intelligence/vizier-sdk --pack-destination release-archives
          npm pack --workspace @agenda-intelligence/vizier-mcp-proxy --pack-destination release-archives
          npm pack --workspace @agenda-intelligence/vizier-gated-deploy --pack-destination release-archives
          node scripts/check-release-archives.mjs release-archives
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pytest cryptography
      - run: pytest packages/python-sdk
      - name: First BLOCK with source SDKs and signed receipts
        run: node scripts/first-block.mjs --signed
        env:
          PYTHONPATH: packages/python-sdk/src
      - name: First BLOCK with published SDKs (hash checks, no JWS support)
        run: |
          npm install --prefix "$RUNNER_TEMP/vizier-published" --no-save @agenda-intelligence/vizier-sdk@0.5.16
          python -m venv "$RUNNER_TEMP/vizier-published-py"
          "$RUNNER_TEMP/vizier-published-py/bin/python" -m pip install vizier-guard==0.3.2
          VIZIER_DEMO_SDK="$RUNNER_TEMP/vizier-published/node_modules/@agenda-intelligence/vizier-sdk/dist/index.js" \
          VIZIER_DEMO_PYTHON="$RUNNER_TEMP/vizier-published-py/bin/python" \
          PYTHONPATH= node scripts/first-block.mjs

  deployment-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build disposable deployment sandbox
        run: docker build -f sandbox/worker-deploy/Dockerfile -t vizier-worker-isolation .
      - name: Exercise separate-UID execution boundary without external network
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,nosuid,nodev
          --tmpfs /app/node_modules/.vite
          --tmpfs /app/node_modules/.vite-temp
          --cap-drop ALL --cap-add SETUID --cap-add SETGID
          --security-opt no-new-privileges vizier-worker-isolation
